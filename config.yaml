environment: development
http:
  port: 8086
runtime:
  data_dir: "./data"
  migration_db_storage_dir: "./data"
  log_address: "127.0.0.1:8081"
  log_level: "debug"
  enable_logging_terminal: true
  default_worker_count: 10
  default_max_retries: 3
  default_coordinator_lead: 4
services:
  local:
    - id: "local"
      name: "Local Filesystem"
      root_path: "/path/to/allowlisted/root"
  spectra:
    - id: "spectra-primary"
      name: "Spectra Primary"
      config_path: "../Migration-Engine/pkg/configs/spectra.json"
      world: "primary"
      root_id: "root"
    - id: "spectra-s1"
      name: "Spectra S1"
      config_path: "../Migration-Engine/pkg/configs/spectra.json"
      world: "s1"
      root_id: "root"

providers:
  google_drive:
    enabled: true
    display_name: "Google Drive"
    service_id: google-drive
    scopes:
      - "https://www.googleapis.com/auth/drive"
  dropbox:
    enabled: true
    display_name: "Dropbox"
    service_id: dropbox
    scopes:
      - files.metadata.read
      - files.content.read
      - files.content.write
      - account_info.read
      - sharing.read
      - team_data.team_space
  sftp:
    enabled: true
    display_name: "SFTP"
    service_id: sftp

